<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LoveMeizu • Tạo Key</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#050609}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;
background:
radial-gradient(circle at 20% 10%,rgba(0,145,255,.25),transparent 32%),
radial-gradient(circle at 85% 85%,rgba(40,100,255,.18),transparent 35%),
linear-gradient(145deg,#030407,#0a0d13 55%,#020306)}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;opacity:.35;
background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.08),transparent 24%);filter:blur(40px)}
.wrap{width:min(92vw,520px);padding:18px}.card{position:relative;border:1px solid rgba(255,255,255,.16);
border-radius:30px;padding:28px;overflow:hidden;background:rgba(13,17,25,.62);
backdrop-filter:blur(24px) saturate(135%);box-shadow:0 28px 80px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.16)}
.card:after{content:"";position:absolute;inset:1px;border-radius:29px;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 18%,transparent 70%,rgba(0,180,255,.10))}
.top{position:relative;z-index:1;display:flex;gap:14px;align-items:center}.icon{width:64px;height:64px;border-radius:19px;
object-fit:cover;border:1px solid rgba(255,255,255,.35);box-shadow:0 0 30px rgba(0,160,255,.28)}
h1{margin:0;font-size:24px;letter-spacing:-.5px}.muted{margin:5px 0 0;color:#aeb8c8;font-size:13px}
.panel{position:relative;z-index:1;margin-top:22px;padding:18px;border-radius:22px;background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.09)}.status{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#b7c0cf}
.key{margin-top:14px;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
border-radius:16px;background:rgba(0,0,0,.25);border:1px dashed rgba(255,255,255,.18);font-weight:800;letter-spacing:1.2px;word-break:break-all}
button{width:100%;border:0;border-radius:16px;padding:14px 16px;margin-top:12px;color:#fff;font-weight:800;font-size:15px;
cursor:pointer;background:linear-gradient(135deg,#087dff,#00b8ff);box-shadow:0 10px 28px rgba(0,140,255,.25)}
button.secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.12)}
button:disabled{opacity:.5;cursor:not-allowed}.foot{position:relative;z-index:1;margin-top:16px;text-align:center;color:#7f8a9b;font-size:11px}
.msg{margin-top:12px;color:#cbd5e1;font-size:13px;line-height:1.5;min-height:20px}.ok{color:#71f2b1}.err{color:#ff8c9d}
</style>
</head>
<body>
<div class="wrap"><main class="card">
  <div class="top">
    <img class="icon" src="icon.png" alt="LoveMeizu">
    <div><h1>LoveMeizu</h1><p class="muted">Secure Key • One-time Key System</p></div>
  </div>
  <section class="panel">
    <div class="status"><span>Trạng thái</span><strong id="status">Sẵn sàng</strong></div>
    <div class="key" id="key">Chưa có Key</div>
    <button id="create">Tạo Key Free</button>
    <button id="redeem" class="secondary" disabled>Nhận Key</button>
    <button id="copy" class="secondary" disabled>Sao chép Key</button>
    <div id="msg" class="msg"></div>
  </section>
  <div class="foot">LoveMeizu KeyHub • Key gắn với HWID • 48 giờ</div>
</main></div>
<script>
const API="https://getkeyhub-s2v6.onrender.com";
const qs=new URLSearchParams(location.search);
let hwid=qs.get("hwid")||"";
let token=qs.get("token")||"";
let lastKey="";

const $=id=>document.getElementById(id);
function msg(t,c=""){ $("msg").textContent=t; $("msg").className="msg "+c; }

$("create").onclick=async()=>{
  $("create").disabled=true;$("status").textContent="Đang tạo...";
  if(!hwid) hwid=prompt("Nhập HWID của script:");
  if(!hwid){msg("Thiếu HWID.","err");$("create").disabled=false;return}
  try{
    const r=await fetch(`${API}/api/getlink?hwid=${encodeURIComponent(hwid)}`);
    const d=await r.json();
    if(!d.ok) throw new Error(d.error==="COOLDOWN"?`Vui lòng chờ ${d.retryAfter}s`:d.error);
    token=d.token;
    history.replaceState({}, "", `?hwid=${encodeURIComponent(hwid)}&token=${encodeURIComponent(token)}`);
    $("redeem").disabled=false;
    $("status").textContent="Đã tạo phiên";
    msg("Phiên nhận Key đã sẵn sàng. Bấm “Nhận Key”.","ok");
  }catch(e){$("status").textContent="Lỗi";msg(e.message,"err");$("create").disabled=false}
};

$("redeem").onclick=async()=>{
  $("redeem").disabled=true;$("status").textContent="Đang xác thực...";
  try{
    const r=await fetch(`${API}/api/redeem?hwid=${encodeURIComponent(hwid)}&token=${encodeURIComponent(token)}`);
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||"Redeem failed");
    lastKey=d.key;$("key").textContent=lastKey;$("copy").disabled=false;
    $("status").textContent="Hoàn tất";msg(`Key có hiệu lực ${d.expiresInHours} giờ.`,"ok");
  }catch(e){$("status").textContent="Lỗi";msg(e.message,"err");$("redeem").disabled=false}
};

$("copy").onclick=async()=>{if(!lastKey)return;await navigator.clipboard.writeText(lastKey);msg("Đã sao chép Key.","ok")};
</script>
</body>
</html>
